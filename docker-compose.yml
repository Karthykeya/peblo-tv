services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app

  cms:
    build: ./cms
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./cms:/app
      - /app/node_modules
    depends_on:
      - api

  viewer:
    build: ./viewer
    restart: unless-stopped
    ports:
      - "5174:5173"
    volumes:
      - ./viewer:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
